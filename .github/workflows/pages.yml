name: Build and deploy static blog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read content source configuration
        id: content
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const {repository, branch} = JSON.parse(fs.readFileSync("content-source.json", "utf8"));
            if (!/^[\w-]+\/[\w.-]+$/.test(repository) || !/^[\w./-]+$/.test(branch)) throw Error("Invalid content source");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `repository=${repository}\nbranch=${branch}\n`);
          '
      - name: Verify private content credential
        env:
          CONTENT_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: |
          if [ -z "$CONTENT_KEY" ]; then
            echo "::error::Missing CONTENT_DEPLOY_KEY; refusing to publish without private content."
            exit 1
          fi
      - name: Checkout private content (read only)
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.content.outputs.repository }}
          ref: ${{ steps.content.outputs.branch }}
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: .private-content
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
        env:
          CONTENT_DIR: .private-content
      - name: Remove private working copies before artifact upload
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const root = process.cwd();
            for (const name of [".private-content", ".content-build"]) {
              const target = path.resolve(root, name);
              if (path.dirname(target) !== root || fs.lstatSync(target).isSymbolicLink()) throw Error("Unsafe cleanup path");
              fs.rmSync(target, {recursive: true});
            }
            for (const channel of ["posts", "travel", "videos"]) {
              const folder = path.join(root, "src", channel);
              for (const file of fs.readdirSync(folder)) if (file.endsWith(".md")) fs.unlinkSync(path.join(folder, file));
            }
          '
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
